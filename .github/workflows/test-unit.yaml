name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install X server and headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libx11-dev

      # The ASAN run and the xdotool run from the README stay manual.
      - name: Run tests
        run: xvfb-run -a go test -race ./...
